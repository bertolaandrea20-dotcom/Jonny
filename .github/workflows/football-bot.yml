name: Football bot

on:
  schedule:
    # 09:10 and 17:10 Italian time (summer): settle results, analyse, place the day's slip
    - cron: "10 7 * * *"
    - cron: "10 15 * * *"
    # weekly backtest refresh, Monday morning
    - cron: "40 5 * * 1"
  push:
    paths:
      - "football-bot/bot/**"
      - "football-bot/config.json"
      - ".github/workflows/football-bot.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily oppure backtest"
        required: true
        default: daily
        type: choice
        options: [daily, backtest]

permissions:
  contents: write

concurrency:
  group: football-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: football-bot/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Sync latest data
        # a run triggered by an older commit must still play on the current ledger
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Run bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "40 5 * * 1" ]; then MODE=backtest; else MODE=daily; fi
          fi
          if [ "$MODE" = daily ] && [ ! -f data/backtest.json ]; then python -m bot.run backtest; fi
          python -m bot.run "$MODE"

      - name: Commit data
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          git commit -m "football-bot: aggiornamento dati $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort; echo "conflitto sui dati: un altro giro ha scritto il registro"; exit 1
            fi
            sleep $((2 ** i))
          done
          exit 1

      - name: Publish dashboard to gh-pages/bot
        run: |
          git fetch origin gh-pages
          git worktree add ../../site origin/gh-pages
          mkdir -p ../../site/bot/data
          cp dashboard/index.html ../../site/bot/
          cp config.json ../../site/bot/data/
          cp data/*.json ../../site/bot/data/
          cd ../../site
          git add bot
          if git diff --cached --quiet; then echo "dashboard invariata"; exit 0; fi
          git commit -m "football-bot: dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin HEAD:gh-pages && exit 0
            git pull --rebase origin gh-pages; sleep $((2 ** i))
          done
          exit 1
