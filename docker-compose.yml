version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: jonny-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jonny
      POSTGRES_PASSWORD: jonny_dev_password
      POSTGRES_DB: jonny
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jonny-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
