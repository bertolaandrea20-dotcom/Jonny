databases:
  - name: jonny-db
    plan: free
    databaseName: jonny
    user: jonny

services:
  # ─── Backend API ───
  - type: web
    name: jonny-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed 2>/dev/null; node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jonny-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/services

  # ─── Frontend ───
  - type: web
    name: jonny-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PORT
        value: 10000
